# 测试环境数据源：内存数据库 H2（MySQL 兼容模式），CI 无需外部 MySQL
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password: ''
  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true
